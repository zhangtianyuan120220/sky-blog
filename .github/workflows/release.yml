name: Release App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest # 支持 macOS 构建

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 替换为 npm install --legacy-peer-deps 解决锁文件不同步和 peer 依赖冲突
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js App
        run: npm run build

      - name: Build & Publish App
        run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}